<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>GVQ — Tell us what you're building</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
:root{--bg:#fafaf8;--card:#fff;--ink:#0b0b0b;--mut:#6b6b68;--line:#e4e4e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0b;--card:#151515;--ink:#f5f5f2;--mut:#9a9a96;--line:#2a2a28}}
:root[data-theme="dark"]{--bg:#0b0b0b;--card:#151515;--ink:#f5f5f2;--mut:#9a9a96;--line:#2a2a28}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Inter Tight',system-ui,sans-serif}
.serif{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400}
header{display:flex;align-items:center;gap:28px;padding:16px 32px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.logo{width:40px;height:40px;border-radius:10px;background:#000;color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;letter-spacing:.5px;cursor:pointer;border:1px dashed #666}
nav{display:flex;gap:22px;flex:1}nav a,.tr a{color:var(--ink);text-decoration:none;cursor:pointer;padding-bottom:2px}nav a.on{border-bottom:1px solid var(--ink)}
.tr{display:flex;gap:18px;align-items:center}.av{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:600}
.badge{background:#c00;color:#fff;border-radius:9px;font-size:10px;padding:0 5px;margin-left:3px}
main{max-width:1100px;margin:0 auto;padding:40px 24px 120px}
.lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600}
h1{font-size:clamp(38px,7vw,72px);line-height:1;letter-spacing:-.03em;margin:14px 0 0;font-weight:700}
h1 .serif{display:block;color:var(--mut);font-weight:400}
.hero{text-align:center;padding:50px 0}.hero p{color:var(--mut);max-width:440px;margin:22px auto 30px;font-size:17px}
.ai{background:var(--card);border:1px solid var(--ink);border-radius:20px;padding:20px 24px;max-width:820px;margin:auto;text-align:left}
textarea,input,select{font:inherit;color:var(--ink);background:transparent;border:0;outline:0;width:100%;resize:none}
.ai textarea{font-size:20px;height:64px;margin-top:6px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.btn{border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 20px;font:inherit;font-weight:500;cursor:pointer}
.btn.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}.btn.s{padding:7px 14px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:12px;display:flex;gap:16px;align-items:center}
.card .m{flex:1;min-width:0}.card h3{margin:0;font-size:19px;display:inline}.sub{color:var(--mut);font-size:14px}.act{display:flex;flex-direction:column;gap:6px}
.th{width:56px;height:56px;border-radius:14px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;flex:none}.th.r{border-radius:50%}
.tag{border:1px solid var(--ink);border-radius:99px;font-size:10px;letter-spacing:.1em;padding:1px 8px;margin:0 6px;font-weight:600;vertical-align:3px}
.demo{font-size:10px;letter-spacing:.1em;color:var(--mut)}.rt{text-align:right;white-space:nowrap}.rt b{font-size:19px}
.promo{border:1px dashed var(--mut);border-radius:18px;padding:16px 20px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:320px 1fr;gap:40px}
.req{background:#0b0b0b;color:#fff;border-radius:18px;padding:22px;margin-top:20px}.req div{display:flex;justify-content:space-between;padding:5px 0}.req span{color:#999}
h2{font-size:30px;letter-spacing:-.02em;margin:0 0 6px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.chip{border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:13px;cursor:pointer;background:var(--card)}.chip.on{background:var(--ink);color:var(--bg)}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin:18px 0}.tabs a{cursor:pointer;padding:8px 0;color:var(--mut)}.tabs a.on{color:var(--ink);border-bottom:2px solid var(--ink)}
.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:20;padding:16px}.modal>div{background:var(--bg);border-radius:20px;padding:26px;max-width:480px;width:100%;max-height:90vh;overflow:auto}
.modal label{display:block;margin-top:12px}.modal input,.modal textarea{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--card);margin-top:4px}
.bub{max-width:75%;padding:9px 14px;border-radius:16px;margin:6px 0;background:var(--card);border:1px solid var(--line)}.bub.me{margin-left:auto;background:var(--ink);color:var(--bg)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity .6s}
html[data-mood] body::before{opacity:1;background:radial-gradient(900px 520px at 12% -8%,color-mix(in srgb,var(--ac) 18%,transparent),transparent),radial-gradient(700px 500px at 100% 100%,color-mix(in srgb,var(--ac) 12%,transparent),transparent)}
html[data-mood],html[data-acc]{--r:20px}
html[data-mood] .btn.p,html[data-acc] .btn.p{background:var(--ac);border-color:var(--ac);color:#fff}
html[data-mood] nav a.on,html[data-acc] nav a.on,html[data-mood] .tabs a.on,html[data-acc] .tabs a.on{border-color:var(--ac)}
html[data-mood] .chip.on,html[data-acc] .chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
html[data-mood] .ai,html[data-acc] .ai{border-color:var(--ac)}html[data-mood] .req{border-left:4px solid var(--ac)}
html[data-mood] .card{animation:up .6s ease both}@keyframes up{from{opacity:0;transform:translateY(8px)}}
html[data-mood=romantic]{--ac:#b04a66}html[data-mood=romantic] .card,html[data-mood=romantic] .box,html[data-mood=romantic] .ai{border-radius:28px;box-shadow:0 14px 34px -22px var(--ac)}html[data-mood=romantic] body::before{animation:br 14s ease-in-out infinite alternate}
html[data-mood=hungry]{--ac:#e03a1e}html[data-mood=hungry] .card{border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ac);transition:transform .15s,box-shadow .15s;animation-duration:.25s}html[data-mood=hungry] .card:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ac)}html[data-mood=hungry] .btn.p{animation:pl 2.2s infinite}@keyframes pl{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--ac) 25%,transparent)}}
html[data-mood=peaceful]{--ac:#5e8574}html[data-mood=peaceful] .card,html[data-mood=peaceful] .box,html[data-mood=peaceful] .ai{border-radius:26px;border-color:color-mix(in srgb,var(--line) 70%,transparent)}html[data-mood=peaceful] body::before{animation:br 9s ease-in-out infinite alternate}@keyframes br{from{opacity:.45}to{opacity:1}}
@media(prefers-reduced-motion:reduce){*,body::before{animation:none!important}}
.bn{display:none}
@media(max-width:760px){header{padding:12px 18px}nav,.tr a{display:none}header .tr{margin-left:auto}.grid{grid-template-columns:1fr;gap:10px}main{padding:24px 18px 110px}
.card{flex-wrap:wrap}.act{flex-direction:row;width:100%}.hero{text-align:left;padding:20px 0}.hero p{margin-left:0}
.bn{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--line);justify-content:space-around;padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));z-index:6}.bn a{cursor:pointer;color:var(--mut)}.bn a.on{color:var(--ink);font-weight:700}}
</style></head><body>
<header><div class="logo" title="Upload GVQ Logo (placeholder)" onclick="go('home')">GVQ</div>
<nav id="nav"></nav><div class="tr"><a onclick="go('discover')">Search</a><a onclick="go('settings')">Settings</a><div class="av" style="cursor:pointer" onclick="go('settings')">YO</div></div></header>
<main id="m"></main><div class="bn" id="bn"></div><div id="md"></div>
<script>
const P=[
{id:1,n:'ABC Apparel',t:'Company',h:'Garment Manufacturer',l:'Kerala',k:'T-shirts • Hoodies • Streetwear',x:'MOQ: 300',r:4.7,c:48,w:'manufacturer garment tshirt t-shirt hoodie apparel production'},
{id:2,n:'Urban Form',t:'Company',h:'Fashion Brand',l:'Mumbai',k:'Streetwear • Private label',r:4.5,c:19,w:'brand streetwear private label manufacturer'},
{id:3,n:'Studio Thread',t:'Company',h:'Textile Design Studio',l:'Bengaluru',k:'Fabric development • Prints',r:4.6,c:27,w:'textile fabric print designer'},
{id:4,n:'Rahul Menon',t:'Creator',h:'Fashion Photographer',l:'Kochi, Kerala',k:'Streetwear • Editorial • Campaign',r:4.8,c:24,w:'photographer photography editorial campaign'},
{id:5,n:'Ananya Nair',t:'Creator',h:'Fashion Stylist',l:'Kochi, Kerala',k:'Editorial • Styling • Wardrobe',r:4.6,c:17,w:'stylist styling editorial'}];
const CATS='AI,Technology,Education,Business,Product Development,Packaging,Import & Export,Retail,E-commerce,Marketing,Branding,Graphic Design,Styling,Videography,Photography,Handcraft & Manufacturing,Textile,Fashion Designing,Beauty'.split(',');
const CW={'Styling':'stylist','Photography':'photographer','Textile':'textile','Handcraft & Manufacturing':'manufacturer','Branding':'brand','Fashion Designing':'designer'};
const S={v:'home',q:'',req:null,reqs:[],notes:[{t:'Welcome to GVQ',m:'Prototype with demo data only.'}],projs:[{id:1,n:'Streetwear Brand — Production',d:'First production run for a new streetwear label.',s:'Looking for Team',team:['You (Owner)'],demo:1}],pi:null,pt:'Overview',tab:'My Projects',chat:[{me:0,x:'Welcome — chat opens once a request is accepted.'}],cat:'',dq:'',art:{}};
const $=s=>document.querySelector(s),e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N=[['home','Home'],['discover','Discover'],['projects','Projects'],['messages','Messages'],['notes','Notifications'],['profile','Profile']];
function go(v){S.v=v;S.pi=null;render();scrollTo(0,0)}
function parse(q){const L=q.toLowerCase(),r={};const roles={manufacturer:'Manufacturer',photographer:'Photographer',stylist:'Stylist',textile:'Textile Specialist','graphic designer':'Graphic Designer',designer:'Designer'};
for(const k in roles)if(L.includes(k)){r.Role=roles[k];break}
const m=L.match(/(\d[\d,]*)\s+([a-z\- ]+?)(?:\s+(?:in|for|from)\b|[.,]|$)/);if(m){r.Quantity=m[1];r.Product=m[2].replace(/^\w/,c=>c.toUpperCase()).replace('T-shirts','T-shirt').replace(/s$/,'')}
const loc=['Kerala','Kochi','Mumbai','Bengaluru','Wayanad'].find(x=>L.includes(x.toLowerCase()));if(loc)r.Location=loc;
if(/manufactur|tshirt|t-shirt|hoodie/.test(L))r.Category='Manufacturing';else if(/photo/.test(L))r.Category='Photography';else if(/styl/.test(L))r.Category='Styling';return r}
function match(r,q){const words=(r.Role||q).toLowerCase().split(/\s+/);let out=P.filter(p=>words.some(w=>w.length>3&&p.w.includes(w.replace(/s$/,''))));
if(r.Location){const lo=r.Location.toLowerCase();out.sort((a,b)=>(b.l.toLowerCase().includes(lo))-(a.l.toLowerCase().includes(lo)))}return out}
function card(p,sel){return `<div class="card"><div class="th ${p.t=='Company'?'':'r'}">${p.n.split(' ').map(x=>x[0]).join('').slice(0,2)}</div><div class="m"><h3>${e(p.n)}</h3><span class="tag">${p.t.toUpperCase()}</span><span class="demo">DEMO DATA</span><div class="sub">${e(p.h)} · ${e(p.l)}</div><div class="sub" style="font-size:13px">${e(p.k)}${p.x?' | '+p.x:''}</div></div><div class="rt"><b>${p.r} ★</b><div class="sub">${p.c} collaborations</div></div><div class="act"><button class="btn s" onclick="prof(${p.id})">View ${p.t=='Company'?'Company':'Profile'}</button><button class="btn s p" onclick="reqForm(${p.id})">Send Request</button></div></div>`}
function ask(q){S.q=q||S.q;if(!S.q.trim())return;const mm=S.q.toLowerCase().match(/make my gvq feel (romantic|hungry|peaceful)/);if(mm){S.q='';TH.mood=mm[1];applyTheme();S.v='settings';render();return}S.req=parse(S.q);S.v='ai';render()}
function render(){document.getElementById('nav').innerHTML=N.map(([k,l])=>`<a class="${S.v==k||(k=='home'&&S.v=='ai')?'on':''}" onclick="go('${k}')">${l}${k=='notes'&&S.reqs.some(r=>r.st=='PENDING_IN')?'<span class="badge">1</span>':''}</a>`).join('');
$('#bn').innerHTML=[['home','Home'],['discover','Discover'],['projects','Projects'],['messages','Messages']].map(([k,l])=>`<a class="${S.v==k?'on':''}" onclick="go('${k}')">${l}</a>`).join('');
$('#m').innerHTML=V[S.v]();const t=$('#aiq');if(t)t.value=S.q}
const aiBox=()=>`<div class="ai"><div class="lbl">What are you building?</div><textarea id="aiq" placeholder="I need a manufacturer for 500 oversized T-shirts in Kerala…" onkeydown="if(event.key=='Enter'&&!event.shiftKey){event.preventDefault();ask(this.value)}"></textarea><div class="row"><span class="sub" style="font-size:13px">Role · product · quantity · location · timeline</span><span><button class="btn" onclick="go('discover')">Explore GVQ</button> <button class="btn p" onclick="ask($('#aiq').value)">Find with GVQ AI</button></span></div></div>`;
const V={
home:()=>`<div class="hero"><div class="lbl">GVQ</div><h1>Tell us what you're building.<span class="serif">AI finds the people you need.</span></h1><p>Connect with the people, businesses and skills you need to build in fashion.</p>${aiBox()}</div>`,
ai:()=>{if(!S.req)return `<h2>GVQ AI</h2><p class="sub">Describe what you're building.</p>${aiBox()}`;const m=match(S.req,S.q);
const rq=Object.entries(S.req).map(([k,v])=>`<div><span>${k}</span>${e(v)}</div>`).join('')||'<div><span>Not enough detail yet</span></div>';
return `<div class="grid"><aside><div class="lbl">You asked</div><p class="serif" style="font-size:28px;line-height:1.1">${e(S.q)}</p><div class="req"><div class="lbl" style="color:#999">Requirement</div>${rq}</div><p><a href="#" onclick="S.req={};S.q=S.q.split(' ').slice(0,3).join(' ');ask();return false">Expand Search</a></p></aside><section><div class="row"><h2>${m.length?m.length+' relevant match'+(m.length>1?'es':'')+' found':'No exact match yet'}</h2><span class="sub">Prototype preview · seed profiles only</span></div>${m.length?m.map(card).join(''):`<div class="box"><p>We couldn't find an exact match in GVQ yet.</p><button class="btn" onclick="S.req={};S.v='discover';render()">Expand Search</button> <button class="btn p" onclick="newProj(S.q)">Post Requirement</button></div>`}<div class="promo"><span class="tag" style="margin:0">PROMOTED</span><h3 style="margin:8px 0 2px">New Sustainable Sneaker</h3><span class="sub">A new product launch by a GVQ company (demo). <a href="#" onclick="return false">View Product</a></span></div></section></div>`},
discover:()=>{const q=S.dq.toLowerCase(),w=S.cat?(CW[S.cat]||S.cat.toLowerCase()):'';const L=P.filter(p=>(p.n+p.h+p.k+p.w).toLowerCase().includes(q)&&(!w||p.w.includes(w)));
return `<h2>Discover</h2><p class="sub">Find people, businesses, skills and opportunities across the fashion ecosystem.</p><div class="box"><input placeholder="Search people, companies, skills or services..." value="${e(S.dq)}" oninput="S.dq=this.value;clearTimeout(window.T);window.T=setTimeout(()=>{render();const i=$('main input');i.focus();i.setSelectionRange(99,99)},250)"></div><div class="chips"><span class="chip ${S.cat?'':'on'}" onclick="S.cat='';render()">All</span>${CATS.map(c=>`<span class="chip ${S.cat==c?'on':''}" onclick="S.cat='${c}';render()">${c}</span>`).join('')}</div>${L.length?L.map(card).join(''):'<div class="box sub">No profiles in this category yet. GVQ only shows real profiles — nothing is invented.</div>'}`},
projects:()=>{const l=S.projs.filter(p=>S.tab=='Completed'?p.s=='Completed':S.tab=='Collaborating On'?p.on:!p.on&&p.s!='Completed');
return `<div class="row"><div><h2>Projects</h2><p class="sub">Build, collaborate and manage everything you're working on.</p></div><button class="btn p" onclick="newProj()">+ New Project</button></div><div class="tabs">${['My Projects','Collaborating On','Completed'].map(t=>`<a class="${S.tab==t?'on':''}" onclick="S.tab='${t}';render()">${t}</a>`).join('')}</div>${l.map(p=>`<div class="card" style="cursor:pointer" onclick="S.pi=${p.id};S.pt='Overview';S.v='proj';render()"><div class="m"><h3>${e(p.n)}</h3>${p.demo?'<span class="demo"> DEMO DATA</span>':''}<div class="sub">${e(p.d)}</div></div><span class="tag">${p.s.toUpperCase()}</span></div>`).join('')||'<p class="sub">Nothing here yet.</p>'}`},
proj:()=>{const p=S.projs.find(x=>x.id==S.pi),T=['Overview','Team','Chat','Files','Artifacts'];let b='';
if(S.pt=='Overview')b=`<p>${e(p.d)}</p><div class="box sub">Status: ${p.s}${p.req?'<br>Requirements: '+e(p.req):''}</div>`;
if(S.pt=='Team')b=p.team.map(t=>`<div class="box" style="margin-bottom:8px">${e(t)}</div>`).join('')+`<button class="btn p" onclick="ask(S.projs.find(x=>x.id==${p.id}).req||S.projs.find(x=>x.id==${p.id}).d)">Find People with AI</button>`;
if(S.pt=='Chat')b=chatUI(p.team.length>1);
if(S.pt=='Files')b=`<div class="box sub">Tech packs, designs, PDFs, references — visible only to accepted project members.<br><br><input type="file" multiple onchange="fl(this,${p.id})"><div id="fl">${(p.files||[]).map(f=>'• '+e(f)).join('<br>')}</div></div>`;
if(S.pt=='Artifacts')b=`<button class="btn p" onclick="art(${p.id})">Create Artifact: Project Brief</button>${(p.arts||[]).map(a=>`<div class="box" style="margin-top:12px;white-space:pre-wrap">${e(a)}</div>`).join('')}`;
return `<a class="sub" onclick="go('projects')" style="cursor:pointer">← Projects</a><h2>${e(p.n)}</h2><div class="tabs">${T.map(t=>`<a class="${S.pt==t?'on':''}" onclick="S.pt='${t}';render()">${t}</a>`).join('')}</div>${b}`},
messages:()=>`<h2>Messages</h2><p class="sub">Chat opens only with accepted collaborators.</p>${chatUI(S.reqs.some(r=>r.st=='ACCEPTED'))}`,
notes:()=>{const rs=S.reqs.map(r=>r.st=='PENDING_IN'?`<div class="box" style="margin-bottom:10px"><div class="lbl">New Collaboration Request</div><h3 style="margin:6px 0">From: ${e(r.f)}</h3><div class="sub">Project: ${e(r.p)}<br>Requirement: ${e(r.q)}<br>Message: ${e(r.m)}</div><br><button class="btn s p" onclick="acc(${r.id})">Accept</button> <button class="btn s" onclick="dec(${r.id})">Decline</button></div>`:r.st=='ACCEPTED'?`<div class="box" style="margin-bottom:10px"><h3 style="margin:0">Collaboration Accepted</h3><div class="sub">You can now start a conversation with ${e(r.f)}.</div><br><button class="btn s p" onclick="go('messages')">Open Chat</button> <button class="btn s" onclick="go('projects')">View Project</button></div>`:r.st=='SENT'?`<div class="box sub" style="margin-bottom:10px">Request sent to ${e(r.to)} — pending.${r.sim?'':' <button class="btn s" onclick="sim('+r.id+')">Simulate incoming request (demo)</button>'}</div>`:`<div class="box sub" style="margin-bottom:10px">Request ${r.st.toLowerCase()}.</div>`).join('');
return `<h2>Notifications</h2><br>${rs}${S.notes.map(n=>`<div class="box" style="margin-bottom:10px"><b>${n.t}</b><div class="sub">${n.m}</div></div>`).join('')}`},
profile:()=>profHTML({n:'Your Name',t:'Creator',h:'Add your headline',l:'Add location',k:'Build with AI below',r:0,c:0,me:1}),
settings:()=>{const ch=(l,on,f)=>`<span class="chip ${on?'on':''}" onclick="${f}">${l}</span>`;return `<h2>Appearance</h2><p class="sub">Choose how GVQ feels to you. Logo, typography and navigation always stay the same.</p><div class="lbl" style="margin-top:20px">Color Theme</div><div class="chips">${[['light','Light'],['dark','Dark'],['custom','Custom']].map(([k,l])=>ch(l,TH.theme==k,`setTh('theme','${k}')`)).join('')}</div>${TH.theme=='custom'?`<div class="box row" style="justify-content:flex-start;gap:20px;margin-bottom:12px"><label class="sub">Background <input type="color" value="${TH.bg}" style="width:48px;height:34px;padding:0" oninput="TH.bg=this.value;applyTheme()"></label><label class="sub">Accent <input type="color" value="${TH.acc}" style="width:48px;height:34px;padding:0" oninput="TH.acc=this.value;applyTheme()"></label></div>`:''}<div class="lbl" style="margin-top:14px">Mood</div><div class="chips">${[['','None'],['romantic','❤️ Romantic'],['hungry','🔥 Hungry'],['peaceful','🌿 Peaceful']].map(([k,l])=>ch(l,TH.mood==k,`setTh('mood','${k}')`)).join('')}</div><p class="sub">Romantic: soft and warm · Hungry: bold and high-energy · Peaceful: calm and minimal. Tip: type "Make my GVQ feel peaceful" in the home box.</p><br><h2>Connected Apps</h2><p class="sub">Integrations are not implemented in this prototype. Authorization will always be requested first.</p>${['Google Drive','Google Calendar','Canva','Gmail','Notion','Slack','GitHub','Gemini'].map(a=>`<div class="box row" style="margin-bottom:8px"><span>${a}</span><button class="btn s" disabled>Connect — coming soon</button></div>`).join('')}`},
view:()=>profHTML(P.find(x=>x.id==S.pid))};
function profHTML(p){const co=p.t=='Company';return `<a class="sub" style="cursor:pointer" onclick="history.length&&go('discover')">← Back</a><div class="card" style="margin-top:12px"><div class="th ${co?'':'r'}" style="width:84px;height:84px;font-size:26px">${p.n.split(' ').map(x=>x[0]).join('').slice(0,2)}</div><div class="m"><h2 style="font-size:32px;margin:0">${e(p.n)} <span class="tag">${p.t.toUpperCase()}</span></h2><div class="sub">${e(p.h)} · 📍 ${e(p.l)}</div>${p.me?'':`<div class="sub"><b style="color:var(--ink)">${p.r} ★</b> · ${p.c} completed collaborations · <span class="demo">DEMO DATA · NOT VERIFIED</span></div>`}</div>${p.me?'':`<button class="btn p" onclick="reqForm(${p.id})">Send Collaboration Request</button>`}</div>
${p.me?`<div class="box"><div class="lbl">Build My Profile with AI</div><textarea id="pb" style="height:70px;margin-top:8px" placeholder="I am a fashion designer from Kochi. I mainly work with sustainable textiles and streetwear."></textarea><button class="btn p s" onclick="pbuild()">Build My Profile</button><div id="po" style="margin-top:12px;white-space:pre-wrap"></div></div>`:`<div class="box"><div class="lbl">Offers</div>${e(p.k)}${p.x?'<br>'+p.x:''}<br><br><div class="lbl">Ratings</div><span class="sub">Demo ratings only. Real ratings appear after an accepted, completed collaboration.</span></div>`}`}
function pbuild(){const t=$('#pb').value.trim();if(!t)return;$('#po').textContent='Draft from your words only (nothing added):\n\nAbout: '+t+'\n\nAdd your real experience, education and portfolio to complete the profile.'}
function prof(id){S.pid=id;S.v='view';render()}
function chatUI(ok){if(!ok)return `<div class="box sub">Chat unlocks after a collaboration request is accepted. Send one from Discover, then accept it in Notifications.</div>`;
return `<div class="row" style="margin-bottom:10px"><b>Chat</b><span><button class="btn s" onclick="shareNo()">Share Number</button> <button class="btn s p" onclick="vcall()">Video Call</button></span></div><div class="box" style="min-height:240px">${S.chat.map(c=>`<div class="bub ${c.me?'me':''}">${c.img?`<img src="${c.img}" style="max-width:100%;border-radius:10px"><br>`:''}${c.vid?`<video src="${c.vid}" controls style="max-width:100%;border-radius:10px"></video><br>`:''}${c.f?'📎 ':''}${e(c.x)}</div>`).join('')}</div><div class="box row" style="margin-top:8px;flex-wrap:nowrap"><input id="cm" placeholder="Message…" onkeydown="if(event.key=='Enter')snd()"><label class="btn s" style="cursor:pointer">Attach<input type="file" multiple accept="image/*,video/*,.pdf,.doc,.docx,.ppt,.pptx,.zip" hidden onchange="att(this)"></label><button class="btn s" onclick="pf()">Project files</button><button class="btn s p" onclick="snd()">Send</button></div>`}
function snd(){const i=$('#cm');if(!i.value.trim())return;S.chat.push({me:1,x:i.value});render();$('#cm').focus()}
function att(i){[...i.files].forEach(f=>{const u=URL.createObjectURL(f),c={me:1,x:f.name,f:1};if(f.type.startsWith('image/')){c.img=u;c.f=0}else if(f.type.startsWith('video/')){c.vid=u;c.f=0}S.chat.push(c)});render()}
function pf(){const fs=S.projs.flatMap(p=>(p.files||[]).map(f=>f));$('#md').innerHTML=`<div class="modal"><div><h2 style="font-size:24px">Project files</h2>${fs.length?fs.map((f,i)=>`<div class="box row" style="margin-bottom:8px"><span>${e(f)}</span><button class="btn s p" onclick="S.chat.push({me:1,x:'${e(f).replace(/'/g,'')}',f:1});$('#md').innerHTML='';render()">Share</button></div>`).join(''):'<p class="sub">No project files yet. Upload them in a project\'s Files tab.</p>'}<button class="btn" onclick="$('#md').innerHTML=''">Close</button></div></div>`}
function shareNo(){$('#md').innerHTML=`<div class="modal"><div><h2 style="font-size:24px">Share your number?</h2><p class="sub">Your number is never shown automatically. It is sent to this person only when you confirm here.</p><label class="sub">Your phone number<input id="ph" type="tel" placeholder="+91 …"></label><br><button class="btn p" onclick="doShare()">Share Number</button> <button class="btn" onclick="$('#md').innerHTML=''">Not now</button></div></div>`}
function doShare(){const v=$('#ph').value.trim();if(!v)return;S.chat.push({me:1,x:'📞 You shared your number: '+v});$('#md').innerHTML='';render()}
function vcall(){$('#md').innerHTML=`<div class="modal"><div style="background:#0b0b0b;color:#fff;text-align:center"><div class="th r" style="margin:20px auto;width:90px;height:90px;background:#fff;color:#000">GV</div><h2 style="font-size:22px">Video call</h2><p style="color:#999">Prototype screen — real video calling is not connected yet.</p><button class="btn" style="background:#c00;color:#fff;border-color:#c00" onclick="$('#md').innerHTML='';S.chat.push({me:0,x:'📹 Video call ended (demo)'});render()">End Call</button></div></div>`}
function fl(i,id){const p=S.projs.find(x=>x.id==id);p.files=(p.files||[]).concat([...i.files].map(f=>f.name));render()}
function art(id){const p=S.projs.find(x=>x.id==id);(p.arts=p.arts||[]).push(`PROJECT BRIEF — ${p.n}\n\nDescription: ${p.d}\nStatus: ${p.s}\nRequirements: ${p.req||'to be added'}\nTeam: ${p.team.join(', ')}\n\n(Generated only from project details you entered.)`);render()}
function reqForm(id){const p=P.find(x=>x.id==id);$('#md').innerHTML=`<div class="modal"><div><h2 style="font-size:24px">Request: ${e(p.n)}</h2>${[['pr','Project'],['rq','Requirement (product, quantity, location, timeline)'],['bd','Budget (optional)']].map(([k,l])=>`<label class="sub">${l}<input id="${k}"></label>`).join('')}<label class="sub">Message<textarea id="ms" rows="3"></textarea></label><br><button class="btn p" onclick="sendReq(${id})">Send Request</button> <button class="btn" onclick="$('#md').innerHTML=''">Cancel</button></div></div>`;if(S.req&&S.req.Quantity)$('#rq').value=Object.values(S.req).join(', ')}
function sendReq(id){const p=P.find(x=>x.id==id);S.reqs.push({id:Date.now(),st:'SENT',to:p.n,f:p.n,p:$('#pr').value||'Untitled project',q:$('#rq').value,m:$('#ms').value});$('#md').innerHTML='';go('notes')}
function sim(id){const r=S.reqs.find(x=>x.id==id);r.sim=1;S.reqs.push({id:id+1,st:'PENDING_IN',f:'Abheeb Rahman (demo)',p:'New Streetwear Brand',q:'500 Oversized T-shirts · Kerala',m:"I'm looking for a manufacturing partner for our first production run."});render()}
function acc(id){const r=S.reqs.find(x=>x.id==id);r.st='ACCEPTED';S.projs[0].team.push(r.f);render()}
function dec(id){S.reqs.find(x=>x.id==id).st='DECLINED';render()}
function newProj(q){$('#md').innerHTML=`<div class="modal"><div><h2 style="font-size:24px">What are you building?</h2><textarea id="np" rows="4" class="box" placeholder="I'm building a sustainable streetwear brand and need a manufacturer, textile designer and photographer."></textarea><br><button class="btn p" onclick="mkProj()">Create Project</button> <button class="btn" onclick="$('#md').innerHTML=''">Cancel</button></div></div>`;if(q)$('#np').value=q}
function mkProj(){const t=$('#np').value.trim();if(!t)return;const r=parse(t);S.projs.push({id:Date.now(),n:t.length>40?t.slice(0,40)+'…':t,d:t,s:'Looking for Team',team:['You (Owner)'],req:Object.entries(r).map(([k,v])=>k+': '+v).join(', ')});$('#md').innerHTML='';go('projects')}
const TH=Object.assign({theme:matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light',mood:'',bg:'#f4efe6',acc:'#444444'},(()=>{try{return JSON.parse(localStorage.getItem('gvqTh'))||{}}catch(x){return{}}})());
function applyTheme(){const h=document.documentElement,st=h.style;['--bg','--card','--ink','--mut','--line','--ac'].forEach(k=>st.removeProperty(k));h.dataset.theme=TH.theme;TH.mood?h.dataset.mood=TH.mood:delete h.dataset.mood;delete h.dataset.acc;
if(TH.theme=='custom'){const c=TH.bg.slice(1),L=(.299*parseInt(c.slice(0,2),16)+.587*parseInt(c.slice(2,4),16)+.114*parseInt(c.slice(4,6),16))/255,d=L<.5;st.setProperty('--bg',TH.bg);st.setProperty('--card',d?`color-mix(in srgb,${TH.bg} 88%,#fff)`:'#fff');st.setProperty('--ink',d?'#f5f5f2':'#0b0b0b');st.setProperty('--mut',d?'#a0a09c':'#6b6b68');st.setProperty('--line',d?'#ffffff26':'#0000001f');if(!TH.mood){st.setProperty('--ac',TH.acc);h.dataset.acc=1}}
try{localStorage.setItem('gvqTh',JSON.stringify(TH))}catch(x){}}
function setTh(k,v){TH[k]=v;applyTheme();render()}
applyTheme();
render();
</script></body></html>
